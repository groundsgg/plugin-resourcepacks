name: Release

on:
  push:
    tags: [v*]

jobs:
  maven:
    permissions:
      contents: read
      packages: write
    secrets:
      PACKAGES_TOKEN: ${{ secrets.GROUNDS_PACKAGES_TOKEN }}
    uses: groundsgg/.github/.github/workflows/gradle-publish.yml@main

  docker:
    permissions:
      contents: write
      packages: write
    secrets:
      PACKAGES_TOKEN: ${{ secrets.GROUNDS_PACKAGES_TOKEN }}
    uses: groundsgg/.github/.github/workflows/docker-gradle-build-push.yml@main
